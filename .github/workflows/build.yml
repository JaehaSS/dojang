name: build

# 태그(v*)를 밀면 macOS·Windows 설치 파일을 빌드해 해당 태그의 초안 릴리스 하나에 올린다.
# 수동 실행(workflow_dispatch)은 빌드만 하고 아티팩트로 남긴다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - os: macos-latest
            target: aarch64-apple-darwin
            artifacts: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      # 로컬의 shared-target 설정은 CI에 없다. 상대 경로로 두면 tauri가 cargo를 src-tauri/에서
      # 부르므로 src-tauri/src-tauri/target이 되어 아래 artifacts 경로와 어긋난다.
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      # macos-latest(7GB)에서 Node 기본 힙(~2GB)으로는 vite build가 OOM으로 죽는다.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build bundle
        run: npx tauri build --target ${{ matrix.target }} --ci
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: dojang-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # 초안 릴리스는 태그 충돌이 없어 매트릭스 작업마다 create하면 초안이 작업 수만큼 생긴다.
  # 빌드는 아티팩트만 남기고, 여기서 한 번만 만든다.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Windows 아티팩트는 nsis/·msi/ 하위 폴더째 내려온다 — 한 폴더로 모은다.
          mkdir out && find dist -type f -name 'Dojang_*' -exec mv {} out/ \;
          cd out
          sha256sum Dojang_* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft \
            --title "Dojang ${GITHUB_REF_NAME#v}" --notes "" Dojang_* SHA256SUMS.txt
